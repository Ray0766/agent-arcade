name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix deploy/transfer-helper --ignore-scripts --omit=optional --no-audit --no-fund
      - run: node scripts/check.cjs
      - run: node scripts/check-release-workflows.cjs
      - run: node scripts/check-first-run-docs.cjs
      # scripts/test.cjs is the same entry as `npm test` on all three platforms.
      # Tests and several modules compare temporary paths with their resolved
      # form, so the script hands them the resolved directory: on macOS the
      # default sits behind a symbolic link (/var is /private/var), and on a
      # Windows runner TEMP is an 8.3 short name (RUNNER~1) that
      # src/qq-supervisor/ownership.cjs refuses.
      # Two files at a time: several QQ process and repair tests use real
      # deadlines and time out when many test files compete for the runner.
      # No single test may run longer than five minutes, so a test that hangs
      # on an untried platform ends the step instead of the whole job timeout.
      - name: Unit tests
        shell: bash
        run: |
          parallel=()
          native=()
          for file in test/*.test.cjs; do
            case "$file" in
              test/qq-supervisor-component-repair*) continue ;; # separate step below
              test/qq-node-host.test.cjs|test/qq-pending-update-lock-crash.test.cjs|test/qq-shell-owner-live.test.cjs|test/qq-shell-orphan-live.test.cjs|test/qq-supervisor-orphan-live.test.cjs|test/qq-transfer-service.test.cjs)
                if [[ "$RUNNER_OS" == Windows ]]; then
                  native+=("$file")
                  continue
                fi ;;
            esac
            parallel+=("$file")
          done
          # Run real Windows process, CIM and crash fixtures without a second
          # test file competing for process startup, disk flushes or CPU.
          status=0
          if (( ${#native[@]} )); then
            node scripts/test.cjs --test-concurrency=1 --test-timeout=300000 "${native[@]}" || status=1
          fi
          node scripts/test.cjs --test-concurrency=2 --test-timeout=300000 "${parallel[@]}" || status=1
          exit "$status"
      # The supervisor component-repair files are the most load-sensitive; they
      # run afterwards, one file at a time.
      - name: Unit tests (serial group)
        shell: bash
        run: node scripts/test.cjs --test-concurrency=1 --test-timeout=300000 test/qq-supervisor-component-repair*.test.cjs
      # The transfer helper is a server for Windows and Linux hosts: its
      # single-owner lock is a named pipe or an abstract socket, and neither
      # exists on macOS.
      - run: npm run test:transfer-helper
        if: runner.os != 'macOS'
  mac-package:
    # Optional: an ad-hoc signed, unnotarized macOS build for manual testing.
    # Nothing is published and no secret is used; a failure does not block.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/mac-credential-helper-native-unit.cjs
      - run: npm run prepack:mac
      - run: node scripts/pack-mac-ci-preview.cjs
        env:
          # The preview script pins identity "-" (ad-hoc). No signing secrets
          # are provided to this job. electron-builder skips even ad-hoc on PRs
          # unless its PR signing step is explicitly enabled.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ditto keeps the bundle's symbolic links and executable bits, which the
      # artifact upload would otherwise flatten.
      - name: Archive the application bundle
        run: |
          app=$(ls -d dist/mac*/*.app | head -n 1)
          test -d "$app"
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fx 'Signature=adhoc'
          ditto -c -k --sequesterRsrc --keepParent "$app" agent-arcade-macos-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-arcade-macos-unsigned
          path: agent-arcade-macos-unsigned.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix deploy/transfer-helper --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run test:ui
      - run: npm run test:bot-ui
      - run: npm run test:chat-ui
      - run: npm run test:providers-ui
      - run: npm run test:work-ui
      - run: npm run test:persona-ui
      - run: npm run test:bot-flow
      - run: npm run test:native
      - run: npm run dist -- --win
      - name: Test packaged application
        shell: pwsh
        run: |
          $env:ARCADE_EXECUTABLE = Join-Path $PWD 'dist\win-unpacked\Agent Arcade.exe'
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:bot-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:chat-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:providers-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:work-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:persona-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: outputs/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: agent-arcade-windows
          path: |
            dist/*.exe
            package-lock.json

# Verification/build artifacts are not public releases. Publication is a separate
# explicit owner action after the candidate and human gates in docs/RELEASE.md.
